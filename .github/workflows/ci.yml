name: CalBook CI

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calbook-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CALCOM_TELEMETRY_DISABLED: "1"
  CI: "true"
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node <<'NODE'
          const title = process.env.PR_TITLE ?? "";
          const conventionalTitle = /^(feat|fix|refactor|perf|test|docs|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+/;

          if (!conventionalTitle.test(title)) {
            console.error("Use a conventional title, for example: feat(bookings): add candidate reminders");
            process.exit(1);
          }
          NODE

      - name: Inspect change scope and protected files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="${HEAD_SHA}^"
          fi

          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          git diff --numstat "$BASE_SHA" "$HEAD_SHA" > /tmp/change-size.txt

          protected_file_found=false
          while IFS= read -r file; do
            case "$file" in
              .env|*/.env|*.pem|*.key|*id_rsa*)
                echo "::error file=$file::Secret-bearing files must never be committed. Use repository or hosting secrets."
                protected_file_found=true
                ;;
            esac
          done < /tmp/changed-files.txt

          if [[ "$protected_file_found" == "true" ]]; then
            exit 1
          fi

          code_files=$(grep -Ec '\.(c|cc|cpp|css|go|graphql|html|js|jsx|json|mjs|prisma|py|rs|scss|ts|tsx)$' /tmp/changed-files.txt || true)
          changed_lines=$(awk '{ additions += ($1 ~ /^[0-9]+$/ ? $1 : 0); deletions += ($2 ~ /^[0-9]+$/ ? $2 : 0) } END { print additions + deletions + 0 }' /tmp/change-size.txt)

          {
            echo "### Change scope"
            echo "- Code files: $code_files"
            echo "- Added and removed lines: $changed_lines"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" != release/* ]]; then
            if (( code_files > 10 || changed_lines > 500 )); then
              echo "::error::Keep feature pull requests below 10 code files and 500 changed lines, or split the change."
              exit 1
            fi
          fi

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/yarn-install
        with:
          node_version: v20.x

      - name: Verify immutable dependency graph
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn prisma generate

      - name: Check lint rules
        run: yarn lint

      - name: Check TypeScript
        run: yarn type-check:ci --force

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: UTC
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/yarn-install
        with:
          node_version: v20.x

      - name: Generate Prisma client
        run: yarn prisma generate

      - name: Run unit tests
        run: yarn test
